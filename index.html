<!doctype html>
<html lang="es">
<head>

<style>
:root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif}*{box-sizing:border-box}body{margin:0;background:#0b101a;color:#f5f7fc}header{padding:18px 24px;background:#151e2d;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:0;font-size:25px}.hint{font-size:13px;color:#a9b7cf}.layout{display:grid;grid-template-columns:310px minmax(0,1fr);height:calc(100vh - 73px)}aside{overflow:auto;background:#111a29;padding:14px}main{min-width:0;display:flex;flex-direction:column;padding:16px;gap:12px}.search{width:100%;background:#202e42;border:1px solid #344761;border-radius:10px;color:white;padding:12px;font-size:16px;margin-bottom:12px}.channel{width:100%;display:block;text-align:left;padding:13px;margin:4px 0;background:transparent;color:#e4eafa;border:1px solid transparent;border-radius:9px;font-size:16px;cursor:pointer}.channel:hover,.channel:focus{background:#283c59;outline:2px solid #77b9ff}.channel.active{background:#164d82;border-color:#65b3fa}.channel small{display:block;color:#b9c6d8;margin-top:4px}.playerbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.playerbar h2{margin:0;font-size:23px;flex:1}.options{display:flex;gap:8px;flex-wrap:wrap}.option{padding:10px 14px;border-radius:9px;border:1px solid #3c5574;background:#26344a;color:white;font-size:15px;cursor:pointer}.option.active{background:#0875d1;border-color:#67b8ff}.option:focus{outline:3px solid #fff}.screen{position:relative;background:#000;flex:1;min-height:280px;border-radius:12px;overflow:hidden}.screen iframe{width:100%;height:100%;border:0}.empty{position:absolute;inset:0;display:grid;place-items:center;color:#b9c6d8;text-align:center;padding:20px}.status{font-size:13px;color:#aabbd0}.action{color:#fff;background:#30445f;border:0;padding:10px 13px;border-radius:9px;cursor:pointer}.action:focus{outline:3px solid white}@media(max-width:750px){.layout{display:flex;flex-direction:column;height:auto}aside{max-height:35vh}main{height:70vh;padding:10px}header{padding:13px}h1{font-size:21px}}
</style>
</head><body>
<header><h1>&#128250; Mi TV</h1><span class="hint">Seleccion&#225; un canal y una opci&#243;n de reproducci&#243;n</span></header>
<div class="layout"><aside><input id="search" class="search" placeholder="Buscar canal..." aria-label="Buscar canal"><div id="channels"></div></aside><main><div class="playerbar"><h2 id="title">Eleg&#237; un canal</h2><button class="action" id="full">Pantalla completa</button></div><div class="options" id="options"></div><div class="screen" id="screen"><div class="empty" id="empty">Seleccion&#225; un canal del men&#250; para comenzar.</div><iframe id="player" title="Reproductor" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" style="display:none"></iframe></div><div class="status" id="status">Algunos reproductores pueden restringir la reproducci&#243;n desde otros sitios.</div></main></div>
<script>
const channels = [
['DAZN LaLiga',['https://streamx723.sbs/global1.php?channel=daznlaliga']],
['Disney+',['https://streamx99.com/player.html?stream=disney2','https://streamx99.com/player.html?stream=disney3','https://streamx99.com/player.html?stream=disney4','https://streamx99.com/player.html?stream=disney5','https://streamx99.com/player.html?stream=disney6','https://streamx99.com/player.html?stream=disney7','https://streamx99.com/player.html?stream=disney9','https://streamx99.com/player.html?stream=disney10','https://streamx99.com/player.html?stream=disney11','https://streamx99.com/player.html?stream=disney12','https://streamx99.com/player.html?stream=disney13','https://streamx99.com/player.html?stream=disney14','https://streamx99.com/player.html?stream=disney20']],
['DSports',['https://streamtp99a.sbs/global1.php?stream=dsports2','https://streamx723.sbs/global1.php?channel=dsportsplus','https://streamx723.sbs/global1.php?channel=dsportspluscl']],
['ESPN Argentina',['https://streamx99.com/player.html?stream=espn','https://streamtp99a.sbs/global1.php?stream=espn']],
['ESPN Chile',['https://streamx723.sbs/global1.php?channel=espn1cl']],
['ESPN M\u00e9xico',['https://streamtp99a.sbs/global1.php?stream=espnmx']],
['ESPN 2',['https://streamtp99a.sbs/global1.php?stream=espn2']],
['ESPN 4',['https://streamtp99a.sbs/global1.php?stream=espn4']],
['ESPN 7',['https://streamxhd.sbs/live1.php?stream=espn7']],
['ESPN Deportes',['https://streamx99.com/player.html?stream=espndeportes','https://streamxhd.sbs/live1.php?stream=espndeportes']],
['ESPN Plus 2',['https://streamx723.sbs/global1.php?channel=espnplus2']],
['ESPN Plus 4',['https://streamx723.sbs/global1.php?channel=espnplus4']],
['ESPN Premium',['https://streamx99.com/player.html?stream=espnpremium','https://streamx723.sbs/global1.php?channel=espnpremium','https://streamxhd.sbs/live1.php?stream=espnpremium']],
['Formula 1', ['https://flive.cc.cd/f1/player?channelId=23', 'https://flive.cc.cd/f1/player?channelId=33']],
['FOX Argentina',['https://streamx723.sbs/global1.php?channel=fox1ar']],
['FOX One',['https://streamx723.sbs/global1.php?channel=foxone1','https://streamx723.sbs/global1.php?channel=foxone2','https://streamx723.sbs/global1.php?channel=foxone3','https://streamx723.sbs/global1.php?channel=foxone9','https://streamx723.sbs/global1.php?channel=foxone10','https://streamx723.sbs/global1.php?channel=foxone11']],
['FOX Soccer Plus',['https://streamx723.sbs/global1.php?channel=foxsoccerplus']],
['MAX',['https://streamx723.sbs/global1.php?channel=max4']],
['LaLiga',['https://streamx723.sbs/global1.php?channel=mlaliga']],
['Premiere',['https://streamx99.com/player.html?stream=premiere1','https://streamtp99a.sbs/global1.php?stream=premiere1']],
['Telemundo',['https://streamtp99a.sbs/global1.php?stream=telemundo','https://streamx723.sbs/global1.php?channel=telemundo']],
['TNT Sports',['https://streamx99.com/player.html?stream=tntsports','https://streamxhd.sbs/live1.php?stream=tntsports','https://streamx723.sbs/global1.php?channel=tntar']],
['TUDN M\u00e9xico',['https://streamx723.sbs/global1.php?channel=tudnmx','https://streamtp99a.sbs/global1.php?stream=tudnmx']],
['Otros / Sin identificar',['https://streamx99.com/drm/cazetv2.php']]
];
let selected=-1, option=0;const list=document.getElementById('channels'),opts=document.getElementById('options'),frame=document.getElementById('player');
function renderList(){const q=document.getElementById('search').value.toLowerCase();list.replaceChildren();channels.forEach(([name,urls],i)=>{if(!name.toLowerCase().includes(q))return;const b=document.createElement('button');b.className='channel'+(i===selected?' active':'');b.textContent=name;const s=document.createElement('small');s.textContent=urls.length===1?'1 opci\u00f3n':urls.length+' opciones';b.appendChild(s);b.onclick=()=>choose(i,0);list.appendChild(b);});}
function choose(i,j){selected=i;option=j;document.getElementById('title').textContent=channels[i][0];opts.replaceChildren();channels[i][1].forEach((url,k)=>{const b=document.createElement('button');b.className='option'+(k===j?' active':'');b.textContent='Opci\u00f3n '+(k+1);b.onclick=()=>choose(i,k);opts.appendChild(b);});frame.src=channels[i][1][j];frame.style.display='block';document.getElementById('empty').style.display='none';document.getElementById('status').textContent='Reproductor: opci\u00f3n '+(j+1)+' de '+channels[i][1].length+'. La disponibilidad depende del proveedor.';renderList();}
document.getElementById('search').addEventListener('input',renderList);document.getElementById('full').onclick=()=>{const el=document.getElementById('screen');if(el.requestFullscreen)el.requestFullscreen();else if(frame.requestFullscreen)frame.requestFullscreen();};renderList();
</script></body></html>
